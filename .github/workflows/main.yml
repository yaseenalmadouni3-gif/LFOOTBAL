name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          mv /root/.config/godot ~/.config/godot || true

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          patch_list=Array[String]([])

          [preset.0.options]
          package/unique_name="org.offlinefootball.demo"
          package/name="Offline Football Demo"
          package/signed=true
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          EOF

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/OfflineFootballDemo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineFootballDemo-APK
          path: build/OfflineFootballDemo.apk
